plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {

    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
//        client {
//            client()
//            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
//            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//        }

//        server {
//            server()
//            programArgument '--nogui'
//            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//        }

//        // This run config launches GameTestServer and runs all registered gametests, then exits.
//        // By default, the server will crash when no gametests are provided.
//        // The gametest system is also enabled by default for other run configs under the /test command.
//        gameTestServer {
//            type = "gameTestServer"
//            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//        }

        runs {
            data {
                data()
                programArgs "--all", "--mod", project.mod_id
                programArgs"--output", project(":neoforge").file("src/generated/resources").absolutePath
            }
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$architectury_api_version"
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

sourceSets {
    main {
        resources {
            srcDir file(rootProject.generatedResourcesNeoForge)
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
